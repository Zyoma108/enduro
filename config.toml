# Базовая конфигурация Enduro. Секреты сюда не кладём — только через env / .env.

[market]
# Биржи, с которых собираем данные.
exchanges = ["binance", "bybit"]
# Источник правды для сигналов — биржа с наибольшим объёмом.
reference_exchange = "binance"
# Биржа, на которой исполняем сделки.
execution_exchange = "bybit"
# "swap" — бессрочные фьючерсы (USDT-маржинальные), "spot" — спот.
market_type = "swap"
# Унифицированные символы ccxt. Для USDT-perp формат BASE/USDT:USDT.
symbols = ["BTC/USDT:USDT", "ETH/USDT:USDT", "SOL/USDT:USDT"]
# Сколько уровней стакана хранить в каждом снимке.
book_depth = 20

[storage]
# Запись потока в Parquet (data/ в .gitignore).
enabled = true
root = "data"
# Как часто сбрасывать буфер на диск, секунды.
flush_interval_s = 60
# Снимки стакана прореживаются до одного в этот интервал на (биржу, символ). 0 — писать все.
book_snapshot_interval_ms = 1000

[scanner]
# Радар сканирует USDT-фьючерсы, которые есть и на reference, и на execution бирже,
# с суточным объёмом на execution бирже не ниже порога (USDT).
min_quote_volume_usd = 10_000_000
# "crypto" — только криптовалюты; "tradfi" — акции, ETF, сырьё, форекс, pre-IPO.
# Монета проходит, только если обе биржи относят её к разрешённому классу.
asset_classes = ["crypto"]
# Сколько дней минутных свечей держать для расчёта «нормы» по часу суток.
history_days = 28
# Комиссия тейкера на execution бирже, б.п. за сторону (Bybit VIP0, фьючерсы: 5.5).
# Используется, чтобы сравнивать ожидаемое движение со стоимостью входа и выхода.
taker_fee_bps = 5.5

[execution]
# "demo" — Bybit Demo Trading (виртуальные деньги), "live" — реальные деньги.
environment = "demo"
# Второй, независимый предохранитель: live запрещён, пока здесь не true.
allow_live = false

[risk]
# Жёсткие лимиты. Проверяются кодом до отправки любого ордера; агент их не обходит.
# Риск на сделку: убыток при срабатывании стопа (с комиссиями), % капитала.
risk_per_trade_pct = 1.0
# Максимальное плечо: стоимость позиции / капитал.
max_leverage = 5
# Одновременно открытых позиций (фокус на одной монете).
max_open_positions = 1
# Дневной убыток, % от капитала на 00:00 UTC: новых сделок до конца дня не будет.
# На demo 5%, для live — пересмотреть.
daily_loss_limit_pct = 5.0
# Просадка от пика капитала: kill-switch, снимается только вручную (enduro risk --reset).
max_drawdown_pct = 10.0
# Не больше сделок в час.
max_trades_per_hour = 6
# Состояние риск-менеджера (пик, начало дня, kill-switch) — переживает перезапуски.
state_path = "state/risk.json"
