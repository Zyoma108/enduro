[project]
name = "enduro"
version = "0.1.0"
description = "LLM-driven intraday crypto trading agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5",
    "duckdb>=1.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyarrow>=19",
]

[project.scripts]
enduro = "enduro.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enduro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
